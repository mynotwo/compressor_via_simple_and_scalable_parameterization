[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sspc"
version = "0.1.0"
description = "Online learned lossless compression with an ordered-mask MLP"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
sspc = "sspc.__main__:main"

[tool.setuptools]
packages = ["sspc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
